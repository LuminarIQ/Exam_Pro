apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adaptive-tutor.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "adaptive-tutor.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "adaptive-tutor.fullname" . }}-api
    spec:
      serviceAccountName: {{ include "adaptive-tutor.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "adaptive-tutor.fullname" . }}-api-config
            - secretRef:
                name: {{ include "adaptive-tutor.fullname" . }}-api-secrets
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
