apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adaptive-tutor.fullname" . }}-api-secrets
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.secretEnv.JWT_SECRET | quote }}
  COOKIE_SECRET: {{ .Values.api.secretEnv.COOKIE_SECRET | quote }}
  DATABASE_URL: {{ .Values.api.secretEnv.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.api.secretEnv.REDIS_URL | quote }}
  METRICS_TOKEN: {{ .Values.api.secretEnv.METRICS_TOKEN | quote }}
