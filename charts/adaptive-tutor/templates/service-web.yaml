apiVersion: v1
kind: Service
metadata:
  name: {{ include "adaptive-tutor.fullname" . }}-web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: {{ include "adaptive-tutor.fullname" . }}-web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: {{ .Values.web.containerPort }}
